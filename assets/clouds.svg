<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <filter id="cloud-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="wispy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <radialGradient id="cloud-grad-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f0f4f8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloud-grad-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#e8eef5" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloud-grad-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#f5f7fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#wispy)">
    <ellipse cx="400" cy="500" rx="450" ry="200" fill="url(#cloud-grad-3)" />
    <ellipse cx="1400" cy="400" rx="550" ry="250" fill="url(#cloud-grad-3)" />
    <ellipse cx="900" cy="700" rx="600" ry="220" fill="url(#cloud-grad-3)" />
  </g>

  <g filter="url(#cloud-blur)">
    <circle cx="280" cy="380" r="160" fill="url(#cloud-grad-1)" />
    <circle cx="420" cy="350" r="190" fill="url(#cloud-grad-1)" />
    <circle cx="580" cy="390" r="170" fill="url(#cloud-grad-2)" />
    <circle cx="340" cy="480" r="140" fill="url(#cloud-grad-2)" />
    <circle cx="490" cy="470" r="180" fill="url(#cloud-grad-1)" />
    <circle cx="660" cy="450" r="130" fill="url(#cloud-grad-3)" />
  </g>

  <g filter="url(#cloud-blur)">
    <circle cx="1200" cy="520" r="180" fill="url(#cloud-grad-1)" />
    <circle cx="1380" cy="460" r="220" fill="url(#cloud-grad-1)" />
    <circle cx="1560" cy="500" r="190" fill="url(#cloud-grad-2)" />
    <circle cx="1270" cy="620" r="160" fill="url(#cloud-grad-2)" />
    <circle cx="1450" cy="600" r="200" fill="url(#cloud-grad-1)" />
    <circle cx="1650" cy="580" r="140" fill="url(#cloud-grad-3)" />
  </g>

  <g filter="url(#cloud-blur)">
    <circle cx="850" cy="220" r="110" fill="url(#cloud-grad-2)" />
    <circle cx="970" cy="240" r="130" fill="url(#cloud-grad-1)" />
    <circle cx="1080" cy="230" r="100" fill="url(#cloud-grad-2)" />
    <circle cx="150" cy="800" r="140" fill="url(#cloud-grad-2)" />
    <circle cx="280" cy="850" r="160" fill="url(#cloud-grad-1)" />
    <circle cx="1750" cy="250" r="150" fill="url(#cloud-grad-2)" />
  </g>
</svg>
