name: Daily Project Maintenance
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-maintenance-${{ github.repository }}
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit project and run available checks
        id: audit
        shell: bash
        continue-on-error: true
        run: |
          set +e
          install_status="not-applicable"
          lint_status="not-applicable"
          test_status="not-applicable"
          build_status="not-applicable"
          if [ -f package.json ]; then
            if [ -f bun.lockb ] || [ -f bun.lock ]; then
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
              bun install --frozen-lockfile
              install_status=$?
              runner="bun run"
            elif [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
              install_status=$?
              runner="pnpm run"
            elif [ -f yarn.lock ]; then
              corepack enable
              yarn install --immutable
              install_status=$?
              runner="yarn"
            else
              npm install
              install_status=$?
              runner="npm run"
            fi
            if [ "$install_status" -eq 0 ]; then
              has_script() { node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$1'] ? 0 : 1)"; }
              if has_script lint; then $runner lint; lint_status=$?; fi
              if has_script test; then $runner test; test_status=$?; fi
              if has_script build; then $runner build; build_status=$?; fi
            fi
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python -m compileall -q .
            build_status=$?
          fi
          {
            echo "install_status=$install_status"
            echo "lint_status=$lint_status"
            echo "test_status=$test_status"
            echo "build_status=$build_status"
          } >> "$GITHUB_OUTPUT"
          printf 'Install: %s\nLint: %s\nTest: %s\nBuild/compile: %s\n' "$install_status" "$lint_status" "$test_status" "$build_status" > maintenance-results.txt
          if [ "$install_status" -gt 0 ] || [ "$lint_status" -gt 0 ] || [ "$test_status" -gt 0 ] || [ "$build_status" -gt 0 ]; then exit 1; fi
      - name: Update README maintenance log
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          timestamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          if [ -f maintenance-results.txt ]; then
            results="$(cat maintenance-results.txt)"
          else
            results="Checks did not produce a result report."
          fi
          if ! grep -q '^## Automated Maintenance Log$' README.md 2>/dev/null; then
            printf '\n\n## Automated Maintenance Log\n\n| Timestamp (UTC) | Workflow | Result | Details |\n|---|---|---|---|\n' >> README.md
          fi
          details="$(printf '%s' "$results" | tr '\n' ';' | sed 's/|/\\|/g')"
          printf '| %s | GitHub Actions | %s | %s |\n' "$timestamp" "$AUDIT_OUTCOME" "$details" >> README.md
          {
            echo "## A320 Airplane — daily maintenance"
            echo "- Time: $timestamp"
            echo "- Workflow result: $AUDIT_OUTCOME"
            echo "$results"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push README update
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record daily maintenance run [skip ci]"
          git push origin HEAD:main
      - name: Send Telegram report when credentials are configured
        if: always() && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          text="Daily maintenance: A320 Airplane
          Repository: ${GITHUB_REPOSITORY}
          Result: ${AUDIT_OUTCOME}
          Commit: ${GITHUB_SHA}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}"
      - name: Report missing Telegram configuration
        if: always() && (secrets.TELEGRAM_BOT_TOKEN == '' || secrets.TELEGRAM_CHAT_ID == '')
        run: echo "Telegram not sent: configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets."
